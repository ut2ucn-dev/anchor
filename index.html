<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F29A1F">
<meta name="description" content="Anchor: бронювання і відкриття слотів для велосипедів, самокатів і моноколіс біля метро. Тестова версія.">
<title>Anchor</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <div class="app" id="app">
    <header class="top" id="top">
      <button class="logo" id="logo" aria-label="Anchor: показати факт">
        <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="4" width="32" height="5" rx="1.5" fill="#F29A1F"/><rect x="3" y="9" width="28" height="22" rx="2" fill="#2D3642"/><rect x="5.5" y="13" width="9" height="16" rx="1" fill="#7FC4CC"/><rect x="19.5" y="13" width="9" height="16" rx="1" fill="#7FC4CC"/><rect x="15.5" y="12" width="3" height="19" fill="#8E96A3"/><circle cx="10" cy="11" r="1.5" fill="#2FD36B"/><circle cx="24" cy="11" r="1.5" fill="#FF4A3F"/></svg>
        <span>ANCHOR</span>
      </button>
      <div class="fact" id="fact" role="status" aria-live="polite" hidden></div>
      <span class="demo-chip">Демо</span>
    </header>

    <main class="tabs" id="tabs">
      <div class="track" id="track">
        <section class="pane" id="pane-map" aria-label="Карта"></section>
        <section class="pane" id="pane-bonus" aria-label="Бонуси"></section>
        <section class="pane" id="pane-settings" aria-label="Налаштування"></section>
      </div>
    </main>

    <p class="exp" id="exp" aria-hidden="true"></p>
    <nav class="nav" id="nav" aria-label="Розділи">
      <button data-tab="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="2"/></svg><span>Карта</span></button>
      <button data-tab="bonus"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Бонуси</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Налаштування</span></button>
    </nav>

    <div class="notif" id="notif" role="status" aria-live="polite"><span class="ni" id="nIc">SMS</span><span><small id="nFrom">Anchor</small><b id="nText"></b></span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="consent" id="consent" hidden role="dialog" aria-modal="false" aria-labelledby="consentT">
      <h2 id="consentT">Статистика використання</h2>
      <p id="consentText"></p>
      <details><summary>Що саме збираємо</summary><ul id="consentList"></ul><p><a href="privacy.html">Політика приватності</a></p></details>
      <div class="consent-btns"><button class="btn" id="cAccept">Прийняти</button><button class="btn" id="cNecessary">Лише необхідні</button></div>
    </div>
  </div>
</div>

<!-- Static copies of the forms so Netlify Forms can detect them at deploy time. The app submits to them with fetch POST "/". -->
<form name="survey" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="rating"><input name="understood"><input name="would_use">
  <input name="features"><input name="features_other"><input name="exp_offer"><input name="exp_mascot"><input name="exp_price"><input name="session_code">
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="contact"><input name="source"><input name="consent">
</form>

<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
